services:
  db:
    image: postgres
    container_name: crm-database
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASS}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "5432:5432"

  backend:
    container_name: crm-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis

  frontend:
    container_name: crm-frontend
    build:
      context: ./client
      dockerfile: Dockerfile
    ports: 
      - "3000:80"
    depends_on:
      - db
      - redis

  redis:
      image: redis:alpine
      ports:
        - "6379:6379"
